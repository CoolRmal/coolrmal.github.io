<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" font-family="Georgia, 'Times New Roman', serif">
  <style>
    .ink{stroke:#1a1a1a;stroke-width:2.2;fill:none;stroke-linecap:round}
    .ball{fill:#eef2f6;stroke:#9fb0bf;stroke-width:1.2}
    .rad{stroke:#7a8b99;stroke-width:1.1;stroke-dasharray:4 3;fill:none}
    .grid{stroke:#cfd6dc;stroke-width:1;stroke-dasharray:3 4}
    .lbl{font-size:15px;fill:#1a1a1a}
    .cap{font-size:14px;fill:#55616b}
    .it{font-style:italic}
  </style>

  <!-- (a) interior point -->
  <circle class="ball" cx="115" cy="95" r="60"/>
  <line class="ink" x1="25" y1="95" x2="205" y2="95"/>
  <line class="rad" x1="115" y1="95" x2="115" y2="35"/>
  <text class="lbl it" x="121" y="60">r</text>
  <circle cx="115" cy="95" r="3.4" fill="#1a1a1a"/>
  <text class="lbl it" x="108" y="118">x</text>
  <text class="cap" x="115" y="185" text-anchor="middle">(a) interior point of a segment</text>
  <text class="cap" x="115" y="205" text-anchor="middle">density 1</text>

  <!-- (b) endpoint -->
  <circle class="ball" cx="380" cy="95" r="60"/>
  <line class="ink" x1="380" y1="95" x2="470" y2="95"/>
  <line class="rad" x1="380" y1="95" x2="380" y2="35"/>
  <text class="lbl it" x="386" y="60">r</text>
  <circle cx="380" cy="95" r="3.4" fill="#1a1a1a"/>
  <text class="lbl it" x="373" y="118">x</text>
  <text class="cap" x="380" y="185" text-anchor="middle">(b) endpoint of a segment</text>
  <text class="cap" x="380" y="205" text-anchor="middle">density 1/2</text>

  <!-- (c) Besicovitch's graph -->
  <line class="grid" x1="575" y1="30" x2="575" y2="160"/>
  <line class="grid" x1="645" y1="30" x2="645" y2="160"/>
  <line class="grid" x1="715" y1="30" x2="715" y2="160"/>
  <circle class="ball" cx="600" cy="88" r="52"/>
  <path class="ink" d="M 515 106 L 575 106 L 575 88 L 645 88 L 645 108 L 715 108 L 715 92 L 750 92"/>
  <circle cx="600" cy="88" r="3.4" fill="#1a1a1a"/>
  <text class="lbl it" x="604" y="80">x</text>
  <text class="cap" x="632" y="185" text-anchor="middle">(c) Besicovitch's graph</text>
  <text class="cap" x="632" y="205" text-anchor="middle">density ≥ 1/2, purely unrectifiable</text>
</svg>
