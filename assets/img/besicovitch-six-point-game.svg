<svg xmlns="http://www.w3.org/2000/svg" width="440" height="270" viewBox="0 0 440 270" role="img" aria-labelledby="title description">
  <title id="title">The six-point game</title>
  <desc id="description">Blue root o and red root e are one unit apart. Each root has two children in its dashed unit circle. The blue segment p1 to p2 and the red segment q1 to q2 each have length at least 2s.</desc>
  <g fill="none" stroke="#828282" stroke-width="1" stroke-dasharray="5 5">
    <circle cx="170" cy="135" r="100"/>
    <circle cx="270" cy="135" r="100"/>
  </g>
  <path d="M170 135H270" fill="none" stroke="#333" stroke-width="1.5"/>
  <g fill="#1565c0" stroke="#1565c0" stroke-width="1.5">
    <path d="M105 74L124 207" fill="none"/>
    <circle cx="170" cy="135" r="4"/>
    <circle cx="105" cy="74" r="4"/>
    <circle cx="124" cy="207" r="4"/>
  </g>
  <g fill="#c62828" stroke="#c62828" stroke-width="1.5">
    <path d="M324 67L341 190" fill="none"/>
    <circle cx="270" cy="135" r="4"/>
    <circle cx="324" cy="67" r="4"/>
    <circle cx="341" cy="190" r="4"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic">
    <g fill="#1565c0">
      <text x="149" y="139">o</text>
      <text x="77" y="77">p<tspan font-size="14" baseline-shift="sub">1</tspan></text>
      <text x="96" y="211">p<tspan font-size="14" baseline-shift="sub">2</tspan></text>
    </g>
    <g fill="#c62828">
      <text x="281" y="139">e</text>
      <text x="336" y="70">q<tspan font-size="14" baseline-shift="sub">1</tspan></text>
      <text x="353" y="194">q<tspan font-size="14" baseline-shift="sub">2</tspan></text>
    </g>
    <text x="214" y="125" fill="#222" font-style="normal">1</text>
  </g>
</svg>
