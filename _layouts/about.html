---
layout: default
---
<div class="container page">
  <header class="post-header">
    <h1 class="post-title"><span class="fw-bold">{{ site.first_name }}</span> {{ site.last_name }}</h1>
    {%- if site.tagline -%}<p class="desc">{{ site.tagline }}</p>{%- endif -%}
  </header>

  <article>
    <div class="profile float-right">
      <figure>
        <img src="{{ site.profile_image | relative_url }}" alt="{{ site.first_name }} {{ site.last_name }}" class="rounded z-depth-1">
      </figure>
      <div class="more-info">
        {%- if site.location -%}<p>{{ site.location }}</p>{%- endif -%}
        <p><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
        <p><a href="{{ site.scholar_url }}" target="_blank" rel="noopener noreferrer">Google Scholar</a></p>
        <p><a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer">GitHub</a></p>
        <p><a href="{{ site.zhihu_url }}" target="_blank" rel="noopener noreferrer">Zhihu 知乎</a></p>
      </div>
    </div>

    <div class="clearfix">{{ content }}</div>
  </article>
</div>
