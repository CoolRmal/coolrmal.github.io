<hr>
<div class="post-navi">
  {%- if page.previous.url -%}
  <a class="post-navi-item nav-prev" href="{{ page.previous.url }}" title="{{ page.previous.title }}">
    <div class="post-navi-label">&larr; Previous</div><div><span>{{ page.previous.title }}</span></div>
  </a>
  {%- else -%}
  <a class="post-navi-item nav-prev" href="{{ '/archive.html' | relative_url }}" title="Blog Archive">
    <div class="post-navi-label">&larr; Archive</div><div><span>All posts</span></div>
  </a>
  {%- endif -%}
  {%- if page.next.url -%}
  <a class="post-navi-item nav-next" href="{{ page.next.url }}" title="{{ page.next.title }}">
    <div class="post-navi-label">Next &rarr;</div><div><span>{{ page.next.title }}</span></div>
  </a>
  {%- else -%}
  <a class="post-navi-item nav-next" href="{{ '/archive.html' | relative_url }}" title="Blog Archive">
    <div class="post-navi-label">Archive &rarr;</div><div><span>All posts</span></div>
  </a>
  {%- endif -%}
</div>
