{% if page.comments != false and site.giscus.repo_id and site.giscus.category_id %}
<section class="article-comments" aria-labelledby="comments-heading">
  <h2 id="comments-heading">Comments</h2>
  <p>Questions, corrections, and further ideas are welcome. Sign in with GitHub to join the discussion.</p>
  <script src="https://giscus.app/client.js"
    data-repo="{{ site.giscus.repo | escape }}"
    data-repo-id="{{ site.giscus.repo_id | escape }}"
    data-category="{{ site.giscus.category | escape }}"
    data-category-id="{{ site.giscus.category_id | escape }}"
    data-mapping="specific"
    data-term="{{ page.url | escape }}"
    data-strict="1"
    data-reactions-enabled="0"
    data-emit-metadata="0"
    data-input-position="bottom"
    data-theme="light"
    data-lang="en"
    data-loading="lazy"
    crossorigin="anonymous"
    async>
  </script>
  <noscript>Enable JavaScript to read and write comments, or visit <a href="https://github.com/{{ site.giscus.repo }}/discussions">the discussions on GitHub</a>.</noscript>
</section>
{% endif %}
